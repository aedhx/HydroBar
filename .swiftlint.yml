# SwiftLint — cf. docs/AUDIT_TECHNIQUE.md § P3-4.
#
# Politique : une **erreur** bloque la CI, un **avertissement** est résumé
# sans bloquer. Les seuils d'erreur sont calés au-dessus de l'existant pour
# que la règle protège contre la dérive (un fichier qui double de taille, un
# force_try qui arrive) sans exiger de tout réécrire d'un coup ; les seuils
# d'avertissement indiquent la cible.

included:
  - src/HydroBar/HydroBar
  - src/HydroBar/HydroBarWidget
  - src/HydroBar/HydroBarTests

excluded:
  - src/HydroBar/HydroBarUITests   # gabarits Xcode, ignorés aussi par la CI
  - src/HydroBar/build

disabled_rules:
  - todo                # les TODO sont suivis dans docs/, pas bloqués ici
  - opening_brace       # conflit avec les closures multi-lignes de SwiftUI
  - trailing_comma      # une virgule finale rend les diffs d'ajout plus propres
  - multiple_closures_with_trailing_closure   # Button(action:) { label } est l'idiome SwiftUI

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - fatal_error_message
  - discouraged_optional_boolean
  - redundant_nil_coalescing

trailing_whitespace:
  ignores_empty_lines: true     # Xcode indente les lignes vides

line_length:
  warning: 160
  error: 250
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 600
  error: 1400                   # HydrationManager : ~1 100 lignes aujourd'hui

type_body_length:
  warning: 400
  error: 1100

function_body_length:
  warning: 80
  error: 700                    # SettingsView.body ; à découper (sections extraites)

cyclomatic_complexity:
  warning: 15
  error: 30

identifier_name:
  min_length: 1                 # i, x, y, h, m sont lisibles dans leur contexte
  max_length: 60
  excluded: [id, ml, oz]

type_name:
  max_length: 60

nesting:
  type_level: 2

large_tuple:
  warning: 3
  error: 4
